name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "{{ go_version }}"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./... -race -cover
{% if use_docker %}

      - name: Build image
        run: docker build -t {{ project_slug }}:ci .
{% endif %}

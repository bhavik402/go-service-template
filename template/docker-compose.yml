name: {{ project_slug }}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: {{ project_slug | replace('-', '_') }}
      POSTGRES_PASSWORD: {{ project_slug | replace('-', '_') }}
      POSTGRES_DB: {{ project_slug | replace('-', '_') }}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ project_slug | replace('-', '_') }}"]
      interval: 5s
      timeout: 5s
      retries: 10
{% if use_redis %}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
{% endif %}
{% if use_kafka %}

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
{% endif %}
{% if use_s3 %}

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
{% endif %}

volumes:
  pgdata:
{% if use_s3 %}
  minio-data:
{% endif %}
